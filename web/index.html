<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0914" />
    <meta name="description" content="星帷塔罗，在星光与牌面之间聆听内心。" />
    <title>星帷塔罗</title>
    <style>
      html{color-scheme:dark;background:#0c0914}body{margin:0;color:#f3edf9;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.boot{min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#2b1b4244,transparent 42%)}.boot__mark{display:grid;place-items:center;gap:16px;letter-spacing:.22em}.boot__star{width:42px;height:42px;border:1px solid #a989e8;transform:rotate(45deg);box-shadow:0 0 32px #a989e844}.boot__star:after{content:"";display:block;width:14px;height:14px;margin:13px;background:#e7c98f;border-radius:50%}
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot" aria-label="星帷塔罗正在载入">
        <div class="boot__mark"><span class="boot__star" aria-hidden="true"></span><span>星帷塔罗</span></div>
      </main>
    </div>
    <noscript>请启用 JavaScript 以进入星帷塔罗。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
